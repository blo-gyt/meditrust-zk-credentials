name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  STELLAR_CLI_VERSION: 28.1.0

jobs:
  lint-and-test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # `rust-toolchain.toml` pins the channel and wasm targets as well.
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build-wasm:
    name: Build contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      # The Soroban SDK build script insists on a Stellar CLI for spec shaking, so
      # build the contracts through it rather than a bare `cargo build`.
      - name: Install Stellar CLI
        run: |
          curl -sSL -o /tmp/stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/stellar-cli.tar.gz -C /tmp stellar
          install -m 0755 /tmp/stellar "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build wasm
        run: make build

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: target/wasm32v1-none/release/meditrust_*.wasm
          if-no-files-found: error
