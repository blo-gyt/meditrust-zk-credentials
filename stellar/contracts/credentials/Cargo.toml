[package]
name = "meditrust-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Non-transferable health-compliance credentials gated by UltraHonk proofs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints.clippy]
# Every entrypoint mirrors the contract ABI, and `#[contractimpl]` copies those
# signatures into generated client/spec code that clippy also inspects. Statement
# fields are passed positionally by design, so the argument count is the interface.
too_many_arguments = "allow"
